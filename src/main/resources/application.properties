# 애플리케이션
spring.application.name=Meetdle

# API 문서 및 Swagger UI
springdoc.api-docs.enabled=${MEETDLE_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${MEETDLE_API_DOCS_ENABLED:false}
springdoc.swagger-ui.disable-swagger-default-url=true

# 데이터베이스 트랜잭션
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# 인증 세션 쿠키
server.servlet.session.cookie.name=MEETDLE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# A: 초대 링크 앞부분(프론트 주소)과 초대 코드 암호화 키 (base64, 각 32바이트).
# 값은 코드에 쓰지 않는다. 내 컴퓨터에서는 application-local.properties(gitignore)에, 배포 서버에서는 환경변수로 넣는다.
meetdle.frontend.origin=${MEETDLE_FRONTEND_ORIGIN:http://localhost:5173}
meetdle.invite.hmac-key=${MEETDLE_INVITE_HMAC_KEY}
meetdle.invite.encryption-key=${MEETDLE_INVITE_ENCRYPTION_KEY}

# 프로젝트 맨 위 폴더의 내 컴퓨터 전용 비밀 설정 파일이 있으면 읽는다 (없으면 무시). 예시: application-local.properties.example
spring.config.import=optional:file:./application-local.properties
