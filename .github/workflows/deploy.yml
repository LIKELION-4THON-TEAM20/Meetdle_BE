name: Spring Boot CI/CD

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: likelion14th-4thon-meetdle
  CONTAINER_NAME: meetdle-backend-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "ref=${REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image to ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,REGISTRY,AWS_REGION,CONTAINER_NAME
          script: |
            set -eo pipefail
            export PATH="$PATH:/snap/bin"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            docker pull "$IMAGE"

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file /home/ubuntu/app.env \
              -p 8080:8080 \
              "$IMAGE"

            docker image prune -af

            echo "===== Application Logs ====="
            sleep 5
            docker logs --tail 30 "$CONTAINER_NAME"
